<?xml version="1.0" encoding="UTF-8"?>
<!--
  Play Console 그래픽 이미지(feature graphic) 1024x500 원본.
  심볼 좌표는 BrandMark.kt의 78 뷰포트 그대로, 인트로 화면과 같은 구도를 가로로 편 것.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="500" viewBox="0 0 1024 500">
  <rect width="1024" height="500" fill="#1E3FA0"/>
  <!-- 인트로의 상단 하이라이트와 같은 은은한 빛 -->
  <radialGradient id="glow" cx="0.5" cy="0.15" r="1.1">
    <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.13"/>
    <stop offset="0.6" stop-color="#FFFFFF" stop-opacity="0"/>
  </radialGradient>
  <rect width="1024" height="500" fill="url(#glow)"/>

  <!-- 브랜드 심볼 (좌측) -->
  <g transform="translate(196 128) scale(3.1)">
    <g fill="none" stroke="#FFFFFF" stroke-width="3.4">
      <rect x="12" y="14" width="54" height="52" rx="9"/>
      <path d="M24 31 H50" stroke-linecap="round"/>
      <path d="M24 40 H54" stroke-linecap="round"/>
      <path d="M24 49 H42" stroke-linecap="round"/>
    </g>
    <circle cx="60" cy="18" r="9" fill="#FF7A6E"/>
  </g>

  <!-- 워드마크 + 태그라인 (우측) -->
  <g font-family="Apple SD Gothic Neo, AppleSDGothicNeo-Bold, sans-serif" fill="#FFFFFF">
    <text x="480" y="235" font-size="76" font-weight="800" letter-spacing="-1">청년의집</text>
    <text x="483" y="298" font-size="30" fill-opacity="0.78">흩어진 공고를 한곳에 받아보세요</text>
    <text x="483" y="352" font-size="21" fill-opacity="0.5" font-family="Menlo, monospace">LH · 지방공사 공고 통합</text>
  </g>
</svg>
